name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a stale run when new commits land on the same PR/branch — no
# point finishing a CI run for code that's already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (strict type checking)
        run: mypy src

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # No database, no Docker: this is the whole point of the Repository
      # Pattern (Fase 1) — AuthService is tested against in-memory fakes.
      - name: Run unit tests
        run: pytest tests/unit -v

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # GitHub-hosted Ubuntu runners come with Docker Engine pre-installed
      # and the docker socket already accessible — no "services:" postgres
      # container needed here. tests/integration/conftest.py manages its
      # own disposable Postgres container via the docker CLI, exactly the
      # same way it does on a developer's machine (see Fase 5).
      - name: Run integration tests
        run: pytest tests/integration -v

  frontend:
    name: Frontend (type-check, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `tsc -b` (type-check) then `vite build` — the same command a
      # developer runs locally (see package.json).
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t auth-service:ci .

      - name: Build frontend image
        run: docker build -t auth-service-frontend:ci ./frontend
