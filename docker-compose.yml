services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off migration runner. Runs once, then exits — `app` waits for it to
  # succeed before starting. Keeps `alembic upgrade head` from racing against
  # itself if `app` is ever scaled to multiple replicas.
  migrate:
    build: .
    env_file: .env
    environment:
      # Overrides whatever DATABASE_URL is in .env: inside the compose
      # network the Postgres host is the service name "db", not "localhost".
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # RS256 key pair: mounted read-only, never baked into the image (see
    # .dockerignore) — rotating a key means replacing the file on the host,
    # not rebuilding the image.
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # Reachable from the *browser*, not from inside the Docker network —
        # see the Dockerfile comment for why this can't be "http://app:8000".
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  db_data:
